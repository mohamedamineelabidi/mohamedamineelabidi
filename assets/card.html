<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0D1117;font-family:-apple-system,"Segoe UI",Inter,Roboto,sans-serif;color:#E6EDF3;overflow:hidden}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;border:2px solid #30363D;border-radius:24px;display:flex;overflow:hidden;background:#0D1117}
  .bar{position:absolute;left:0;top:0;bottom:0;width:8px;background:#58A6FF}
  .shot{width:56%;padding:36px 0 36px 44px;box-sizing:border-box;display:flex;align-items:center}
  .shot .frame{width:100%;height:100%;border-radius:16px;overflow:hidden;background:#161B22;border:1px solid #30363D;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:var(--pos,center);display:block}
  .shot img.pad{object-fit:contain;background:#fff;padding:14px;box-sizing:border-box}
  .shot img.phone{object-fit:contain;background:#161B22}
  .text{width:44%;padding:56px 48px 56px 40px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-size:22px;color:#58A6FF;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:14px}
  h1{font-size:46px;line-height:1.1;margin:0 0 20px;font-weight:700;letter-spacing:-.01em}
  p{font-size:27px;line-height:1.35;color:#8B949E;margin:0 0 30px}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{font-size:23px;padding:8px 16px;border-radius:999px;background:#161B22;border:1px solid #30363D;color:#C9D1D9}
</style></head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="shot"><div class="frame"><img id="img"></div></div>
  <div class="text">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p id="line"></p>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script>
  const q=new URLSearchParams(location.search);
  const img=document.getElementById('img');
  img.src=q.get('img'); img.className=q.get('mode')||''; img.style.setProperty('--pos',q.get('pos')||'center');
  document.getElementById('kicker').textContent=q.get('kicker')||'';
  document.getElementById('title').textContent=q.get('title');
  document.getElementById('line').textContent=q.get('line');
  document.getElementById('chips').innerHTML=(q.get('chips')||'').split(',').map(c=>`<span class="chip">${c.trim()}</span>`).join('');
</script>
</body></html>
